[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "polar-pyro-android-plugin"
version = "0.1.0"
description = "Deterministic Android authority and build-plan compiler for Polar Pyro"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "LUXERON"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
polar-android-plan = "polar_pyro_android.compiler:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
